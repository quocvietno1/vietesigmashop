<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Viet Esigma Shop</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700;800&display=swap">
<style>
:root{--bg:#F1F4F9;--sf:#fff;--ink:#142033;--mu:#5B6B82;--ln:#DDE4EE;--ac:#2457D6;--acb:#fff;--ok:#1E8E5A;--er:#B42318;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#0F1724;--sf:#182234;--ink:#E8EEF7;--mu:#98A6BC;--ln:#2A3750;--ac:#6E94FF;--acb:#0F1724;--ok:#4FD08F;--er:#FF8A7A;color-scheme:dark}}
*{box-sizing:border-box}
html{height:100%}
body{margin:0;min-height:100%;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:400 15px/1.45 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--sf);z-index:10}
.wrap{max-width:680px;width:100%;margin:0 auto;flex:1}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--sf);border-bottom:1px solid var(--ln);padding:10px 14px 0}
.top{display:flex;justify-content:space-between;align-items:center;gap:10px}
h1{margin:0;font-size:1.2rem;font-weight:800;letter-spacing:-.02em;line-height:1.15}
h1 small{display:block;font-size:.7rem;font-weight:400;color:var(--mu);letter-spacing:0}
.acc{position:relative;flex-shrink:0}
.accbtn{display:flex;align-items:center;gap:6px;min-height:44px;padding:0 14px;background:none;border:1px solid var(--ln);border-radius:22px;color:var(--ink);font:700 .85rem "Be Vietnam Pro",system-ui,sans-serif;cursor:pointer;max-width:190px;white-space:nowrap}
.accbtn b{color:var(--ok)}
.accmenu{position:absolute;right:0;top:calc(100% + 6px);min-width:220px;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:6px;box-shadow:0 8px 24px rgba(0,0,0,.18);z-index:30}
.accmenu[hidden]{display:none}
.mi{display:block;width:100%;text-align:left;background:none;border:0;border-radius:8px;min-height:44px;padding:0 12px;color:var(--ink);font:500 .95rem "Be Vietnam Pro",system-ui,sans-serif;cursor:pointer}
.mi:hover{background:var(--bg)}.mi.out{color:var(--er)}
.mt{padding:8px 12px;color:var(--mu);font-size:.8rem;word-break:break-all}
.mt b{display:block;color:var(--ok);font-size:1.05rem}
nav{display:flex;margin-top:4px;overflow-x:auto}
nav button{flex:1;background:none;border:0;border-bottom:3px solid transparent;color:var(--mu);font:500 .88rem "Be Vietnam Pro",system-ui,sans-serif;padding:8px 6px;min-height:44px;cursor:pointer;white-space:nowrap}
nav button[aria-selected="true"]{color:var(--ink);border-color:var(--ac);font-weight:700}
main{padding:14px}
h2{font-size:1rem;margin:20px 0 8px}h2:first-child{margin-top:0}
ul{list-style:none;margin:0;padding:0}
button,input,select,textarea{font-family:inherit}
.seg{display:flex;background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:none;color:var(--mu);font:600 .86rem "Be Vietnam Pro",system-ui,sans-serif;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--ac);color:var(--acb)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.im{aspect-ratio:4/3;background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:2rem}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.cb{padding:10px;display:flex;flex-direction:column;gap:3px;flex:1}
.cb h3{margin:0;font-size:.9rem;line-height:1.3}
.cb h3,.cb p{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.cb p{margin:0;color:var(--mu);font-size:.78rem}
.meta{font-size:.72rem;color:var(--mu)}
.foot{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-top:auto;padding-top:6px}
.pr{font-weight:800;font-size:.95rem}.pr.fr{color:var(--ok)}
.cart{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0 12px;border:0;border-radius:22px;background:var(--ac);color:var(--acb);font:700 .82rem "Be Vietnam Pro",system-ui,sans-serif;cursor:pointer}
.cart.armed{background:var(--ok);color:#fff}
.btn,.ad .acts button{background:var(--ac);color:var(--acb);border:0;border-radius:8px;min-height:44px;padding:0 16px;font-weight:700;font-size:.9rem;cursor:pointer}
.alt,.ghost,.up{display:inline-flex;align-items:center;background:none;color:var(--ink);border:1px solid var(--ln);border-radius:8px;min-height:44px;padding:0 16px;font-weight:500;font-size:.9rem;cursor:pointer;margin:0}
.ad .acts .ghost{background:none;color:var(--er);border:1px solid var(--ln)}
button:disabled{opacity:.4;cursor:not-allowed}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.box{background:var(--sf);border:1px solid var(--ln);border-radius:12px;padding:14px}
.box dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:6px 14px}
.box dt{color:var(--mu);font-size:.85rem}.box dd{margin:0;font-weight:700;word-break:break-all}
.note{color:var(--mu);font-size:.82rem;margin:8px 0}
label{display:block;font-size:.78rem;color:var(--mu);margin-bottom:8px}
input,select,textarea{display:block;width:100%;min-height:44px;margin-top:3px;padding:0 12px;border:1px solid var(--ln);border-radius:8px;background:var(--sf);color:var(--ink);font:inherit;font-size:.95rem}
textarea{padding:10px 12px;min-height:80px}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.sec{background:var(--sf);border:1px solid var(--ln);border-radius:12px;margin-bottom:10px}
.sec>summary{padding:12px 14px;font-weight:700;cursor:pointer;min-height:44px;display:flex;align-items:center}
.bd{padding:0 14px 14px}
.ad{border-top:1px solid var(--ln)}
.ps{display:flex;gap:10px;align-items:center;padding:10px 0;cursor:pointer;min-height:44px}
.ps small{display:block;color:var(--mu);font-size:.75rem}
.th{width:44px;height:44px;border-radius:8px;background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.th img{width:100%;height:100%;object-fit:cover}
.g{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}.g .w{grid-column:1/-1}
.imgbox{display:flex;align-items:center;gap:10px;margin-bottom:4px}
.imgbox img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.imgbox img[hidden]{display:none}
.row{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid var(--ln)}
.row h3{margin:0;font-size:.95rem;word-break:break-word}.row small{color:var(--mu)}
.row .plus{font-weight:800;color:var(--ok);white-space:nowrap}
.row a{display:inline-flex;align-items:center;min-height:44px;padding:0 16px;border-radius:8px;background:var(--ac);color:var(--acb);font-weight:700;font-size:.88rem;text-decoration:none}
.empty{padding:28px 8px;text-align:center;color:var(--mu)}
footer{width:100%;margin-top:auto;background:var(--sf);padding:18px max(14px,calc(50% - 326px)) 28px;color:var(--mu);font-size:.82rem;border-top:1px solid var(--ln)}
footer b{color:var(--ink)}footer p{margin:6px 0}
footer .ct{display:flex;flex-wrap:wrap;gap:8px 16px;margin:8px 0}
footer a{color:var(--ac);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;min-height:44px}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:10px;font-size:.9rem;opacity:0;pointer-events:none;transition:.2s;max-width:90%;text-align:center;z-index:40}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
.lnk{display:block;background:none;border:0;padding:0;min-height:36px;text-align:left;color:var(--ac);font:600 .75rem "Be Vietnam Pro",system-ui,sans-serif;cursor:pointer}
.qrw{display:flex;justify-content:center;background:#fff;border-radius:12px;padding:14px;margin-bottom:10px}
#qr img,#qr canvas{display:block}
.kv{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--ln)}
.kv small{display:block;color:var(--mu);font-size:.75rem}.kv b{word-break:break-all}
.kv .alt{min-height:40px;padding:0 12px;font-size:.82rem;flex-shrink:0}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="wrap">
<header>
  <div class="top">
    <h1>Viet Esigma Shop<small>Tài liệu tải về ngay sau khi mua</small></h1>
    <div class="acc"><button id="accbtn" class="accbtn" data-a="menu" aria-haspopup="true" aria-expanded="false"></button><div id="accmenu" class="accmenu" hidden></div></div>
  </div>
  <nav id="nav" role="tablist"></nav>
</header>
<main id="app"><div class="empty">Đang tải…</div></main>
</div>
<footer id="foot"></footer>
<div id="toast" role="status" aria-live="polite"></div>
<script>
var API='https://jjwlazyhanjrzvikajxh.supabase.co',KEY='sb_publishable_9bRwAIKYvcXzrgxXXUVVmw_4T8ib5ha',SK='ves_session';
var sess=null,P=null,products=[],orders=[],topups=[],cfg={},shorts=[],adm={prods:[],links:{}},tab='shop',kind='paid',authMode='login',menuOpen=false,armed=null,busy=false,tt,openSec=new Set();
try{sess=JSON.parse(localStorage.getItem(SK))}catch(e){}
var $=s=>document.querySelector(s);
var fmt=n=>new Intl.NumberFormat('vi-VN').format(n||0)+'đ';
var dt=s=>new Date(s).toLocaleString('vi-VN',{dateStyle:'short',timeStyle:'short'});
var esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
var isUrl=u=>/^https?:\/\//i.test(u);
var safe=u=>isUrl(u)?u:'#';
var CART='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1.5"/><circle cx="18" cy="20" r="1.5"/><path d="M2 3h3l2.7 12.4a1 1 0 0 0 1 .8h9.2a1 1 0 0 0 1-.8L21 7H6"/></svg>';
function toast(m){var t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('on'),Math.max(2800,m.length*50))}
function vi(m){m=String(m);
 if(/invalid login/i.test(m))return 'Sai email hoặc mật khẩu';
 if(/already registered/i.test(m))return 'Email này đã có tài khoản, hãy bấm Đăng nhập';
 if(/at least 6/i.test(m))return 'Mật khẩu cần từ 6 ký tự';
 if(/valid email|invalid format/i.test(m))return 'Email chưa đúng';
 if(/rate limit/i.test(m))return 'Thử quá nhiều lần, hãy đợi vài phút';
 if(/Failed to fetch|NetworkError/i.test(m))return 'Mất kết nối mạng, hãy thử lại';
 if(/column|image_url|is_free|sold|claim_free/i.test(m))return 'Cần chạy lệnh SQL cập nhật trong Supabase trước';
 return m}
function setSess(s){sess=s;try{s?localStorage.setItem(SK,JSON.stringify(s)):localStorage.removeItem(SK)}catch(e){}}
function mk(d){return{access_token:d.access_token,refresh_token:d.refresh_token,exp:Date.now()+(d.expires_in-60)*1000,uid:d.user.id,email:d.user.email}}
async function auth(path,body){
 var r=await fetch(API+'/auth/v1/'+path,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify(body)});
 var d=await r.json();if(!r.ok)throw new Error(d.msg||d.error_description||d.message||'Có lỗi xảy ra');return d}
async function fresh(){if(sess&&Date.now()>sess.exp){try{setSess(mk(await auth('token?grant_type=refresh_token',{refresh_token:sess.refresh_token})))}catch(e){setSess(null);P=null}}}
async function api(path,o){
 o=o||{};await fresh();
 var h={apikey:KEY,'Content-Type':'application/json'};
 if(sess)h.Authorization='Bearer '+sess.access_token;
 if(o.prefer)h.Prefer=o.prefer;
 var r=await fetch(API+'/rest/v1/'+path,{method:o.m||'GET',headers:h,body:o.b?JSON.stringify(o.b):undefined});
 var t=await r.text(),d=null;try{d=t?JSON.parse(t):null}catch(e){}
 if(!r.ok)throw new Error((d&&(d.message||d.hint))||'Lỗi '+r.status);return d}
function shrink(f){return new Promise((ok,no)=>{var im=new Image(),u=URL.createObjectURL(f);
 im.onload=()=>{var k=Math.min(1,800/Math.max(im.width,im.height)),c=document.createElement('canvas'),x;c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(im,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(new Error('Không xử lý được ảnh')),'image/jpeg',.82)};
 im.onerror=()=>no(new Error('File không phải ảnh'));im.src=u})}
async function upImg(f){
 var b=await shrink(f);await fresh();if(!sess)throw new Error('Hãy đăng nhập lại');
 var n='p'+Date.now()+'.jpg',r=await fetch(API+'/storage/v1/object/product-images/'+n,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+sess.access_token,'Content-Type':'image/jpeg'},body:b});
 if(!r.ok){var d={};try{d=await r.json()}catch(e){}throw new Error(d.message||'Tải ảnh thất bại')}
 return API+'/storage/v1/object/public/product-images/'+n}

async function refresh(){
 try{
  products=await api('products?select=id,name,description,price,stock,image_url,sold,free_link,free_count&active=eq.true&order=id');
  var s=await api('settings?select=key,value');cfg={};s.forEach(x=>cfg[x.key]=x.value);
  if(sess){
   var p=await api('profiles?select=email,nap_code,balance,is_admin&id=eq.'+sess.uid);P=p[0]||null;
   orders=await api('orders?select=id,product_name,price,link,created_at&order=created_at.desc');
   topups=await api('topups?select=id,amount,content,created_at&order=created_at.desc&limit=30');
   if(P&&P.is_admin){
    adm.prods=await api('products?select=*&order=id');
    var l=await api('product_secrets?select=product_id,link');adm.links={};l.forEach(x=>adm.links[x.product_id]=x.link);
    try{shorts=await api('shorteners?select=id,name,api_url&order=id')}catch(e){shorts=[]}
   }
  }else{P=null;orders=[];topups=[]}
 }catch(e){
  if(/JWT|expired/i.test(e.message)){setSess(null);P=null}
  toast(vi(e.message));
 }
 render();
}

function vAuth(){var s=authMode==='signup';return '<h2>'+(s?'Đăng ký tài khoản':'Đăng nhập')+'</h2><label>Email<input id="em" type="email" autocomplete="email" autocapitalize="none"></label><label>Mật khẩu (từ 6 ký tự)<input id="pw" type="password" autocomplete="'+(s?'new-password':'current-password')+'"></label><div class="acts"><button class="btn" data-a="'+(s?'signup':'login')+'">'+(s?'Đăng ký':'Đăng nhập')+'</button><button class="alt" data-a="mode" data-m="'+(s?'login':'signup')+'">'+(s?'Đã có tài khoản? Đăng nhập':'Chưa có tài khoản? Đăng ký')+'</button></div>'}
function card(p){
 var free=kind==='free',out=!free&&p.stock<1,a=armed===p.id;
 var btn=free?'<button class="cart" data-a="claim" data-id="'+p.id+'">Vượt link</button>':'<button class="cart'+(a?' armed':'')+'" data-a="buy" data-id="'+p.id+'" aria-label="'+(a?'Xác nhận mua':'Mua '+esc(p.name))+'"'+(out?' disabled':'')+'>'+(a?'Xác nhận':CART)+'</button>';
 return '<li class="card"><div class="im">'+(p.image_url?'<img src="'+esc(safe(p.image_url))+'" alt="" loading="lazy">':'📄')+'</div><div class="cb"><h3>'+esc(p.name)+'</h3><p>'+esc(p.description)+'</p><span class="meta">'+(free?'Đã nhận '+(p.free_count||0)+' lượt':'Đã bán '+(p.sold||0)+' lượt · '+(out?'Hết hàng':'Còn '+p.stock))+'</span>'+(free&&p.price>0?'<button class="lnk" data-a="kind" data-k="paid">Mua '+fmt(p.price)+' để khỏi vượt link</button>':'')+(!free&&p.free_link?'<button class="lnk" data-a="kind" data-k="free">Có bản miễn phí (vượt link)</button>':'')+'<div class="foot"><span class="pr'+(free?' fr':'')+'">'+(free?'Miễn phí':fmt(p.price))+'</span>'+btn+'</div></div></li>'}
function vShop(){
 var pa=products.filter(p=>p.price>0),fr=products.filter(p=>p.free_link),f=kind==='free'?fr:pa;
 return '<div class="seg"><button data-a="kind" data-k="paid" aria-pressed="'+(kind==='paid')+'">Mất phí ('+pa.length+')</button><button data-a="kind" data-k="free" aria-pressed="'+(kind==='free')+'">Miễn phí ('+fr.length+')</button></div>'+(kind==='free'?'<p class="note" style="margin-top:0">Sản phẩm miễn phí cần vượt link để nhận. Không muốn vượt link thì mua ở mục Mất phí, bạn nhận link gốc ngay.</p>':'')+(f.length?'<ul class="grid">'+f.map(card).join('')+'</ul>':'<div class="empty">Chưa có sản phẩm ở mục này.</div>')}
var payAmt=0,pay=null,payTimer=null;
var BANKS={'970422':'MB Bank','970432':'VPBank','970436':'Vietcombank','970415':'VietinBank','970418':'BIDV','970405':'Agribank','970407':'Techcombank','970416':'ACB','970423':'TPBank','970403':'Sacombank','970448':'OCB','970437':'HDBank','970441':'VIB','970426':'MSB','970443':'SHB','970431':'Eximbank','970452':'KienlongBank','970440':'SeABank','970449':'LPBank'};
function payBox(){return '<h2>Nạp tiền</h2><label>Số tiền muốn nạp (đ)<input id="pa" type="number" inputmode="numeric" min="10000" step="1000" placeholder="Từ 10.000đ" value="'+(payAmt||'')+'"></label><div class="acts">'+[20000,50000,100000,200000].map(n=>'<button class="alt" data-a="amt" data-n="'+n+'">'+fmt(n)+'</button>').join('')+'</div><div class="acts"><button class="btn" data-a="payos">Tạo mã nạp tiền</button><button class="alt" data-a="reload">Làm mới số dư</button></div><p class="note">Mã QR và thông tin chuyển khoản sẽ hiện ngay tại đây. Chuyển xong, số dư tự cộng sau vài giây.</p>'}
function kv(l,v,c){return '<div class="kv"><div><small>'+l+'</small><b>'+esc(v)+'</b></div>'+(c?'<button class="alt" data-a="copyv" data-v="'+esc(c)+'">Chép</button>':'')+'</div>'}
function payCard(){var p=pay,e=new Date(p.exp*1000);
 return '<h2>Chuyển khoản nạp '+fmt(p.amount)+'</h2><div class="box"><div class="qrw"><div id="qr"></div></div><p class="note" style="text-align:center;margin-top:0">Quét mã bằng app ngân hàng, hoặc chuyển khoản theo thông tin bên dưới.</p>'+
 kv('Ngân hàng',BANKS[p.bin]||('Mã ngân hàng '+p.bin))+kv('Số tài khoản',p.accountNumber,p.accountNumber)+kv('Chủ tài khoản',p.accountName)+kv('Số tiền',fmt(p.amount),String(p.amount))+kv('Nội dung chuyển khoản',p.description,p.description)+
 '<div class="acts"><button class="alt" data-a="saveqr">Lưu ảnh QR</button><button class="alt" data-a="payclose">Đóng</button></div></div><p class="note">Mã có hiệu lực đến '+e.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'})+'. Hãy chuyển đúng số tiền và nội dung. Thanh toán xong số dư tự cộng, không cần bấm gì.</p>'}
function startPoll(){clearInterval(payTimer);payTimer=setInterval(async function(){
 if(!pay){clearInterval(payTimer);return}
 if(Date.now()>pay.exp*1000+30000){pay=null;clearInterval(payTimer);render();return}
 if(busy)return;
 await refresh();
 if(pay&&topups.some(x=>(x.content||'').indexOf('#'+pay.orderCode)>-1)){pay=null;clearInterval(payTimer);toast('Nạp tiền thành công');render()}
},4000)}
function vTopup(){
 if(!P)return vAuth();
 return (pay?payCard():payBox())+'<h2>Lịch sử nạp tiền</h2>'+(topups.length?'<ul>'+topups.map(x=>'<li class="row"><div><h3>'+esc(x.content||'Nạp tiền')+'</h3><small>'+dt(x.created_at)+'</small></div><span class="plus">+'+fmt(x.amount)+'</span></li>').join('')+'</ul>':'<div class="empty">Chưa có giao dịch nạp tiền nào.</div>')}
function vHist(){
 if(!P)return vAuth();
 if(!orders.length)return '<div class="empty">Bạn chưa mua hoặc nhận sản phẩm nào. Sản phẩm sẽ hiện ở đây kèm link tải.</div>';
 return '<ul>'+orders.map(x=>'<li class="row" style="display:block"><h3>'+esc(x.product_name)+'</h3><small>'+dt(x.created_at)+' · '+(x.price?fmt(x.price):'Miễn phí')+'</small><div class="acts"><a href="'+esc(safe(x.link))+'" target="_blank" rel="noopener noreferrer">Mở link tải</a><button class="alt" data-a="copy" data-id="'+x.id+'">Sao chép link</button></div></li>').join('')+'</ul>'}
function sopts(sel){return shorts.map(x=>'<option value="'+x.id+'"'+(String(sel)===String(x.id)?' selected':'')+'>'+esc(x.name)+'</option>').join('')||'<option value="">(chưa có dịch vụ)</option>'}
function fields(p){p=p||{};var s1=shorts[0]?shorts[0].id:'',s2=shorts[1]?shorts[1].id:s1;return '<div class="g"><label class="w">Tên<input data-f="name" value="'+esc(p.name)+'"></label><label class="w">Giới thiệu<input data-f="description" value="'+esc(p.description)+'"></label><label class="w">Link gốc (chưa rút gọn), khách mua nhận link này<input data-f="link" value="'+esc(adm.links[p.id]||'')+'" placeholder="https://"></label><label>Bản miễn phí (vượt link)<select data-f="layers">'+'<option value="keep"'+(p.free_link?' selected':'')+'>Giữ / tự dán link vượt (ô dưới)</option><option value="0"'+(p.free_link?'':' selected')+'>Không có bản miễn phí</option><option value="1">Rút gọn 1 lần</option><option value="2">Rút gọn 2 lần</option></select></label><label>Giá bán (đ), 0 là không bán<input data-f="price" type="number" inputmode="numeric" value="'+(p.price||0)+'"></label><label>Lần 1 dùng<select data-f="s1">'+sopts(s1)+'</select></label><label>Lần 2 dùng<select data-f="s2">'+sopts(s2)+'</select></label><label>Số lượng bán<input data-f="stock" type="number" inputmode="numeric" value="'+(p.stock||0)+'"></label><label class="w">Link vượt (tự tạo khi chọn Rút gọn, hoặc tự dán vào đây)<input data-f="free_link" placeholder="https://" value="'+esc(p.free_link||'')+'"></label></div><div class="imgbox"><img '+(p.image_url?'src="'+esc(safe(p.image_url))+'"':'hidden')+' alt=""><input type="hidden" data-f="image_url" value="'+esc(p.image_url||'')+'"><label class="up">Chọn ảnh<input type="file" accept="image/*" hidden></label></div>'}
function sec(k,t,body){return '<details class="sec" data-sec="'+k+'"'+(openSec.has(k)?' open':'')+'><summary>'+t+'</summary><div class="bd">'+body+'</div></details>'}
function prow(p){return '<li class="ad" data-id="'+p.id+'"><details data-sec="p'+p.id+'"'+(openSec.has('p'+p.id)?' open':'')+'><summary class="ps"><span class="th">'+(p.image_url?'<img src="'+esc(safe(p.image_url))+'" alt="">':'📄')+'</span><span><b>'+esc(p.name)+'</b><small>'+(p.price>0?'Mất phí '+fmt(p.price)+' · còn '+p.stock+' · bán '+(p.sold||0):'')+(p.price>0&&p.free_link?' | ':'')+(p.free_link?'Miễn phí · nhận '+(p.free_count||0):'')+'</small></span></summary>'+fields(p)+'<div class="acts"><button data-a="save" data-id="'+p.id+'">Lưu</button><button class="ghost" data-a="del" data-id="'+p.id+'">Xoá</button></div></details></li>'}
function vAdmin(){
 if(!P||!P.is_admin)return vShop();
 var c=cfg;
 return sec('credit','Cộng tiền cho khách','<label>Email của khách<input id="cu" type="email" autocapitalize="none"></label><label>Số tiền (đ)<input id="ca" type="number" inputmode="numeric" min="1"></label><button class="btn" data-a="credit">Cộng tiền</button>')+
 sec('prods','Sản phẩm ('+adm.prods.length+')','<p class="note" style="margin-top:0">Sản phẩm có Link gốc sẽ vào mục Miễn phí, có giá bán sẽ vào mục Mất phí. Có cả hai thì vào cả hai mục.</p><ul>'+adm.prods.map(prow).join('')+'</ul>')+
 sec('add','Thêm sản phẩm mới','<div id="addf">'+fields()+'</div><div class="acts"><button class="btn" data-a="add">Thêm sản phẩm</button></div>')+
 sec('short','Dịch vụ rút gọn link ('+shorts.length+')','<p class="note" style="margin-top:0">Dán địa chỉ API của dịch vụ, thay token bằng {token} và link cần rút gọn bằng {url}. Ví dụ: https://ten-mien/api?api={token}&amp;url={url}</p><ul>'+shorts.map(x=>'<li class="kv"><div><b>'+esc(x.name)+'</b><small>'+esc(x.api_url)+'</small></div><button class="alt" data-a="sdel" data-id="'+x.id+'">Xoá</button></li>').join('')+'</ul><label>Tên dịch vụ<input id="sn"></label><label>Địa chỉ API (có {url}, thường có {token})<input id="su" placeholder="https://.../api?api={token}&amp;url={url}"></label><label>API token<input id="st" type="password" autocomplete="off"></label><button class="btn" data-a="sadd">Thêm dịch vụ</button>')+
 sec('info','Thông tin quản trị (chân trang)','<label>Giới thiệu shop<textarea id="ia">'+esc(c.shop_about)+'</textarea></label><label>Số Zalo<input id="iz" inputmode="tel" value="'+esc(c.contact_zalo)+'"></label><label>Link Facebook<input id="ifb" value="'+esc(c.contact_facebook)+'" placeholder="https://"></label><label>Email liên hệ<input id="ie" value="'+esc(c.contact_email)+'"></label><label>Giờ hỗ trợ<input id="ih" value="'+esc(c.contact_hours)+'"></label><button class="btn" data-a="info">Lưu thông tin</button>')}
function tabs(){var t=[['shop','Cửa hàng']];if(P){t.push(['topup','Nạp tiền'],['hist','Lịch sử']);if(P.is_admin)t.push(['admin','Quản trị'])}return t}
function render(){
 var T=tabs();if(tab==='auth'?!!P:!T.some(t=>t[0]===tab))tab='shop';
 var ab=$('#accbtn'),am=$('#accmenu');
 ab.innerHTML=P?'<b>'+fmt(P.balance)+'</b><span>▾</span>':'<span>Tài khoản ▾</span>';
 ab.setAttribute('aria-expanded',String(menuOpen));am.hidden=!menuOpen;
 am.innerHTML=P?'<div class="mt">'+esc(P.email)+'<b>Số dư: '+fmt(P.balance)+'</b></div><button class="mi" data-a="go" data-t="topup">Nạp tiền</button><button class="mi" data-a="go" data-t="hist">Lịch sử</button><button class="mi out" data-a="logout">Đăng xuất</button>':'<button class="mi" data-a="authgo" data-m="login">Đăng nhập</button><button class="mi" data-a="authgo" data-m="signup">Đăng ký</button>';
 $('#nav').innerHTML=T.map(t=>'<button role="tab" data-a="tab" data-t="'+t[0]+'" aria-selected="'+(tab===t[0])+'">'+t[1]+'</button>').join('');
 $('#app').innerHTML={shop:vShop,auth:vAuth,topup:vTopup,hist:vHist,admin:vAdmin}[tab]();
 if(tab==='topup'&&pay&&window.QRCode){var qe=$('#qr');if(qe){qe.innerHTML='';new QRCode(qe,{text:pay.qrCode,width:220,height:220,correctLevel:QRCode.CorrectLevel.M})}}
 var z=cfg.contact_zalo,fb=cfg.contact_facebook,em=cfg.contact_email;
 $('#foot').innerHTML='<b>Viet Esigma Shop</b>'+(cfg.shop_about?'<p>'+esc(cfg.shop_about)+'</p>':'')+((z||isUrl(fb)||em)?'<div class="ct">'+(z?'<a href="https://zalo.me/'+esc(z.replace(/\D/g,''))+'" target="_blank" rel="noopener noreferrer">Zalo '+esc(z)+'</a>':'')+(isUrl(fb)?'<a href="'+esc(fb)+'" target="_blank" rel="noopener noreferrer">Facebook</a>':'')+(em?'<a href="mailto:'+esc(em)+'">'+esc(em)+'</a>':'')+'</div>':'')+(cfg.contact_hours?'<p>'+esc(cfg.contact_hours)+'</p>':'')+'<p>© '+new Date().getFullYear()+' Viet Esigma Shop</p>';
}
var num=id=>Math.max(0,Math.floor(Number($(id).value)||0));
function collect(c){var v={};c.querySelectorAll('[data-f]').forEach(i=>v[i.dataset.f]=i.value.trim());v.price=Math.max(0,Math.floor(Number(v.price)||0));v.stock=Math.max(0,Math.floor(Number(v.stock)||0));return v}
function pbody(v){return{name:v.name,description:v.description,price:v.price,stock:v.stock,is_free:false,image_url:v.image_url||null,free_link:v.free_link||null}}
function chk(v){
 var L=v.layers||'0',has=L==='keep'?!!v.free_link:L!=='0';
 if(!v.name)return 'Cần có tên sản phẩm';
 if(v.link&&!isUrl(v.link))return 'Link gốc phải bắt đầu bằng https://';
 if((v.price>0||L==='1'||L==='2')&&!v.link)return 'Cần nhập Link gốc (chưa rút gọn)';
 if(L==='keep'&&v.free_link&&!isUrl(v.free_link))return 'Link vượt phải bắt đầu bằng https://';
 if(!has&&!(v.price>0))return 'Cần đặt giá bán hoặc chọn bản miễn phí vượt link';
 return ''}
async function viaBrowser(ids,url){
 var link=url;
 for(var i=0;i<ids.length;i++){
  var rows=await api('shorteners?select=name,api_url,token&id=eq.'+ids[i]),sv=rows[0];
  if(!sv)throw new Error('Không tìm thấy dịch vụ rút gọn');
  var r=await fetch(sv.api_url.replace('{token}',encodeURIComponent(sv.token)).replace('{url}',encodeURIComponent(link)));
  var t=(await r.text()).trim(),out='';
  try{var j=JSON.parse(t);out=j.shortenedUrl||j.short_url||j.html||j.url||j.link||''}catch(x){out=t}
  if(!/^https?:\/\/\S+$/.test(out))throw new Error(sv.name+': '+t.slice(0,100));
  link=out}
 return link}
async function mkFree(v){
 var L=v.layers||'0';
 if(L==='keep')return v.free_link||null;
 if(L!=='1'&&L!=='2')return null;
 var ids=[Number(v.s1)];if(L==='2')ids.push(Number(v.s2||v.s1));
 if(!ids[0])throw new Error('Hãy thêm dịch vụ rút gọn link trước (mục Dịch vụ rút gọn link)');
 toast('Đang tạo link rút gọn…');await fresh();
 var msg='';
 try{
  var r=await fetch(API+'/functions/v1/shorten',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+sess.access_token,'Content-Type':'application/json'},body:JSON.stringify({url:v.link,providers:ids})});
  var d={};try{d=await r.json()}catch(x){}
  if(r.ok&&d.link)return d.link;
  msg=d.error||'Không tạo được link rút gọn'
 }catch(x){msg=x.message}
 try{toast('Máy chủ bị chặn, đang thử từ trình duyệt…');return await viaBrowser(ids,v.link)}
 catch(x){throw new Error(msg+' | '+(/Failed to fetch/i.test(x.message)?'Trình duyệt cũng không gọi được. Hãy tự tạo link rồi dán vào ô Link vượt, chọn "Giữ / tự dán link vượt".':x.message))}
}

document.addEventListener('click',async function(e){
 var b=e.target.closest('[data-a]');
 if(!b){if(menuOpen&&!e.target.closest('.acc')){menuOpen=false;render()}return}
 if(busy)return;
 busy=true;
 var a=b.dataset.a,id=Number(b.dataset.id),p;
 try{
  if(a==='menu'){menuOpen=!menuOpen}
  else if(a==='go'){tab=b.dataset.t;menuOpen=false;armed=null;window.scrollTo(0,0)}
  else if(a==='authgo'){authMode=b.dataset.m;tab='auth';menuOpen=false;armed=null;window.scrollTo(0,0)}
  else if(a==='mode'){authMode=b.dataset.m}
  else if(a==='tab'){menuOpen=false;tab=b.dataset.t;armed=null;window.scrollTo(0,0)}
  else if(a==='kind'){kind=b.dataset.k;armed=null}
  else if(a==='login'||a==='signup'){
   var em=$('#em').value.trim(),pw=$('#pw').value;
   if(!em||!pw){toast('Hãy nhập email và mật khẩu')}
   else{
    var d=await auth(a==='login'?'token?grant_type=password':'signup',{email:em,password:pw});
    if(!d.access_token){authMode='login';toast('Đã tạo tài khoản, hãy đăng nhập')}
    else{setSess(mk(d));tab='shop';await refresh();toast('Xin chào '+em)}
   }
  }
  else if(a==='logout'){setSess(null);P=null;orders=[];topups=[];adm={prods:[],links:{}};tab='shop';menuOpen=false;toast('Đã đăng xuất')}
  else if(a==='buy'){
   p=products.find(x=>x.id===id);
   if(!P){authMode='login';tab='auth';toast('Hãy đăng nhập để mua hàng')}
   else if(!p||p.stock<1){toast('Sản phẩm đã hết hàng')}
   else if(P.balance<p.price){armed=null;tab='topup';toast('Số dư chưa đủ, còn thiếu '+fmt(p.price-P.balance)+'. Hãy nạp thêm tiền.')}
   else if(armed!==id){armed=id;toast('Bấm lần nữa để xác nhận mua')}
   else{armed=null;await api('rpc/buy_product',{m:'POST',b:{p_id:id}});tab='hist';await refresh();toast('Mua thành công. Link tải nằm ở mục Lịch sử.')}
  }
  else if(a==='claim'){
   p=products.find(x=>x.id===id);
   if(!p||!isUrl(p.free_link)){toast('Sản phẩm chưa có link miễn phí')}
   else{window.open(p.free_link,'_blank','noopener');toast('Hãy vượt link để nhận tài liệu');try{await api('rpc/claim_free',{m:'POST',b:{p_id:id}});p.free_count=(p.free_count||0)+1}catch(x){}}
  }
  else if(a==='amt'){payAmt=Number(b.dataset.n)}
  else if(a==='payos'){
   var am=num('#pa');payAmt=am;
   if(am<10000){toast('Nạp tối thiểu 10.000đ')}
   else{
    await fresh();
    var pr=await fetch(API+'/functions/v1/payos-create',{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+sess.access_token,'Content-Type':'application/json'},body:JSON.stringify({amount:am,return_url:location.origin+location.pathname})});
    var pd={};try{pd=await pr.json()}catch(x){}
    if(!pr.ok||!pd.checkoutUrl)throw new Error(pd.error||'Không tạo được link thanh toán');
    if(pd.qrCode&&pd.accountNumber){pay={orderCode:pd.orderCode,amount:pd.amount||am,description:pd.description,accountNumber:pd.accountNumber,accountName:pd.accountName,bin:pd.bin,qrCode:pd.qrCode,exp:Math.floor(Date.now()/1000)+900};startPoll();toast('Đã tạo mã nạp tiền')}
    else{toast('Đang chuyển sang payOS…');location.href=pd.checkoutUrl}
   }
  }
  else if(a==='copyv'){try{await navigator.clipboard.writeText(b.dataset.v);toast('Đã chép')}catch(x){toast('Không chép được, hãy giữ chữ để chép tay')}}
  else if(a==='saveqr'){var cv=$('#qr canvas'),qu=cv?cv.toDataURL('image/png'):(($('#qr img')||{}).src);if(qu){var lk=document.createElement('a');lk.href=qu;lk.download='qr-nap-tien.png';document.body.appendChild(lk);lk.click();lk.remove();toast('Đã lưu ảnh. Mở app ngân hàng, chọn quét mã từ thư viện ảnh.')}else{toast('Chưa lưu được ảnh QR')}}
  else if(a==='payclose'){pay=null;clearInterval(payTimer)}
  else if(a==='copy'){var o=orders.find(x=>x.id===id);try{await navigator.clipboard.writeText(o.link);toast('Đã sao chép link')}catch(x){toast('Không sao chép được, hãy bấm Mở link tải')}}
  else if(a==='copycode'){try{await navigator.clipboard.writeText(P.nap_code);toast('Đã sao chép nội dung chuyển khoản')}catch(x){toast('Hãy tự chép: '+P.nap_code)}}
  else if(a==='reload'){await refresh();toast('Đã làm mới')}
  else if(a==='credit'){
   var ce=$('#cu').value.trim(),ca=num('#ca');
   if(!ce||!ca){toast('Nhập email và số tiền')}
   else{await api('rpc/admin_add_balance',{m:'POST',b:{p_email:ce,p_amount:ca}});await refresh();toast('Đã cộng '+fmt(ca)+' cho '+ce)}
  }
  else if(a==='bank'||a==='info'){
   var ids=a==='bank'?{bank_name:'#bn',bank_no:'#bo',bank_owner:'#bw'}:{shop_about:'#ia',contact_zalo:'#iz',contact_facebook:'#ifb',contact_email:'#ie',contact_hours:'#ih'};
   await api('settings',{m:'POST',prefer:'resolution=merge-duplicates',b:Object.keys(ids).map(k=>({key:k,value:$(ids[k]).value.trim()}))});
   await refresh();toast('Đã lưu')
  }
  else if(a==='save'){
   var v=collect(b.closest('li')),er=chk(v);
   if(er){toast(er)}
   else{
    v.free_link=await mkFree(v);
    await api('products?id=eq.'+id,{m:'PATCH',b:pbody(v)});
    if(v.link)await api('product_secrets',{m:'POST',prefer:'resolution=merge-duplicates',b:{product_id:id,link:v.link}});
    else await api('product_secrets?product_id=eq.'+id,{m:'DELETE'});
    await refresh();toast('Đã lưu sản phẩm')
   }
  }
  else if(a==='sadd'){
   var sn=$('#sn').value.trim(),su=$('#su').value.trim(),st=$('#st').value.trim();
   if(!sn||!/^https:\/\/.+\{url\}/.test(su)){toast('Cần có tên và địa chỉ API https chứa {url}')}
   else{await api('shorteners',{m:'POST',b:{name:sn,api_url:su,token:st}});await refresh();toast('Đã thêm dịch vụ rút gọn')}
  }
  else if(a==='sdel'){await api('shorteners?id=eq.'+id,{m:'DELETE'});await refresh();toast('Đã xoá dịch vụ')}
  else if(a==='del'){await api('products?id=eq.'+id,{m:'DELETE'});await refresh();toast('Đã xoá sản phẩm')}
  else if(a==='add'){
   var n=collect($('#addf')),er2=chk(n);
   if(er2){toast(er2)}
   else{
    n.free_link=await mkFree(n);
    var r=await api('products',{m:'POST',prefer:'return=representation',b:pbody(n)});
    if(n.link)await api('product_secrets',{m:'POST',b:{product_id:r[0].id,link:n.link}});
    openSec.delete('add');await refresh();toast('Đã thêm sản phẩm')
   }
  }
 }catch(x){toast(vi(x.message))}
 busy=false;render();
});
document.addEventListener('change',async function(e){
 var f=e.target;if(f.type!=='file'||!f.files[0]||busy)return;
 busy=true;toast('Đang tải ảnh…');
 try{var u=await upImg(f.files[0]),bx=f.closest('.imgbox'),im=bx.querySelector('img');bx.querySelector('[data-f="image_url"]').value=u;im.src=u;im.hidden=false;toast('Đã tải ảnh. Bấm Lưu hoặc Thêm để hoàn tất.')}
 catch(x){toast(vi(x.message))}
 busy=false;f.value='';
});
document.addEventListener('toggle',function(e){var d=e.target;if(d.dataset&&d.dataset.sec){d.open?openSec.add(d.dataset.sec):openSec.delete(d.dataset.sec)}},true);
setInterval(function(){if(sess&&!busy&&tab==='topup')refresh()},15000);
var q=new URLSearchParams(location.search);
if(q.get('orderCode')){
 history.replaceState(null,'',location.pathname);
 if(q.get('cancel')==='true'||q.get('status')==='CANCELLED'){toast('Bạn đã huỷ thanh toán')}
 else{tab='topup';toast('Đang xác nhận thanh toán…');var pn=0,piv=setInterval(async function(){pn++;if(!busy)await refresh();if(pn>=8){clearInterval(piv);toast('Đã cập nhật số dư')}},3000)}
}
refresh();
</script>
